# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.caching=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.5
loom_version=1.11-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=com.grahambartley
archives_base_name=too-many-chests

# Dependencies
fabric_version=0.107.0+1.21.1
modmenu_version=11.0.3
# Last JEI 1.21.1 build that runs on fabric_version above; 19.42+ requires Fabric API 0.116.5+.
jei_version=19.39.0.372
emi_version=1.1.24+1.21.1

# Load JEI and EMI into the dev client. Off by default so their overlays stay out of screenshots;
# turn on with -Precipe_viewers=true when testing the recipe viewer integration.
recipe_viewers=false
