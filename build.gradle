import java.nio.charset.StandardCharsets

plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.diffplug.spotless' version '6.25.0'
	id 'jacoco'
	id 'checkstyle'
	id 'com.modrinth.minotaur' version '2.9.0'
}

version = gradle.startParameter.projectProperties.getOrDefault("version", project.mod_version)
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Terraformers'
		url 'https://maven.terraformersmc.com/'
	}
	maven {
		name = 'BlameJared'
		url 'https://maven.blamejared.com/'
	}
}

loom {
	splitEnvironmentSourceSets()

	accessWidenerPath = file("src/main/resources/total-storage.accesswidener")

	mods {
		"total-storage" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			programArgs "--username", "DevPlayer"
		}
		gametest {
			server()
			name "Game Test"
			vmArg "-ea"
			runDir "build/gametest"
			programArgs "--nogui"
			property "fabric-api.gametest", "true"
			property "fabric-api.gametest.report-file", "${project.buildDir}/gametest-results.xml"
		}
		gametestServer {
			inherit gametest
			name "Game Test Server"
		}
	}
}

sourceSets {
	clientTest {
		compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output + sourceSets.main.output
		runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output + sourceSets.main.output
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	modCompileOnly "mezz.jei:jei-1.21.1-fabric-api:${project.jei_version}"
	modCompileOnly "dev.emi:emi-fabric:${project.emi_version}:api"
	if (project.recipe_viewers.toBoolean()) {
		modLocalRuntime "mezz.jei:jei-1.21.1-fabric:${project.jei_version}"
		modLocalRuntime "dev.emi:emi-fabric:${project.emi_version}"
	}

	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
	testImplementation "com.puppycrawl.tools:checkstyle:${project.checkstyle_version}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.mockito:mockito-core:5.10.0'
	testImplementation 'org.mockito:mockito-junit-jupiter:5.10.0'

	clientTestImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
	clientTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	clientTestImplementation 'org.mockito:mockito-core:5.10.0'
	clientTestImplementation 'org.mockito:mockito-junit-jupiter:5.10.0'
}

processResources {
	def templateVersion = project.version
	def templateGroup = project.group

	inputs.property "version", templateVersion
	inputs.property "group", templateGroup

	filesMatching("fabric.mod.json") {
		expand "version": templateVersion, "group": templateGroup
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

test {
	useJUnitPlatform()
	inputs
		.file(rootProject.file("config/checkstyle/checkstyle.xml"))
		.withPropertyName("noCommentsGateConfig")
		.withPathSensitivity(PathSensitivity.RELATIVE)
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
	finalizedBy jacocoTestReport
}

tasks.register("clientTest", Test) {
	group = "verification"
	description = "Runs client-side unit tests."
	useJUnitPlatform()
	testClassesDirs = sourceSets.clientTest.output.classesDirs
	classpath = sourceSets.clientTest.runtimeClasspath
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
}

jacoco {
	toolVersion = "0.8.12"
}

checkstyle {
	toolVersion = project.checkstyle_version
	configFile = rootProject.file("config/checkstyle/checkstyle.xml")
	maxWarnings = 0
	maxErrors = 0
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

tasks.register("verifyMainSourceSideSafety") {
	group = "verification"
	description = "Fails if src/main/java references client-only classes"
	def mainJavaFiles = fileTree("src/main/java") {
		include "**/*.java"
	}
	inputs.files(mainJavaFiles)

	doLast {
		def disallowedPatterns = [
			"net.minecraft.client.",
			"com.grahambartley.totalstorage.compat.",
			"com.grahambartley.totalstorage.render.",
			"com.grahambartley.totalstorage.model.",
			"com.grahambartley.totalstorage.screen.",
			"com.grahambartley.totalstorage.mixin.client.",
			"com.grahambartley.totalstorage.TotalStorageClient",
			"com.grahambartley.totalstorage.TotalStorageDataGenerator",
			"com.grahambartley.totalstorage.TotalStorageModMenu",
			"com.grahambartley.totalstorage.ModKeyBindings",
			"com.grahambartley.totalstorage.network.ModNetworkingClient",
			"com.grahambartley.totalstorage.config.ClientConfigMirror"
		]
		def violations = []

		inputs.files.files.each { file ->
			def text = file.getText(StandardCharsets.UTF_8.name())
			disallowedPatterns.each { pattern ->
				if (text.contains(pattern)) {
					violations << "${file}: contains '${pattern}'"
				}
			}
		}

		if (!violations.isEmpty()) {
			throw new GradleException("Main source set side-safety violations found:\n" + violations.join("\n"))
		}
	}
}

check {
	dependsOn spotlessCheck
	dependsOn verifyMainSourceSideSafety
	dependsOn clientTest
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}

spotless {
	java {
		target 'src/**/*.java'
		targetExclude 'build/**'
		googleJavaFormat('1.19.2')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
	format 'misc', {
		target '**/*.gradle', '**/*.md', '**/.gitignore'
		targetExclude '.claude/**', '**/.claude/**', 'build/**', '.gradle/**'
		trimTrailingWhitespace()
		indentWithTabs()
		endWithNewline()
	}
}

modrinth {
	projectId = 'total-storage'
	versionNumber = project.version.toString()
	versionName = "Total Storage v${project.version}"
	versionType = System.getenv('MOD_RELEASE_TYPE') ?: 'alpha'
	uploadFile = remapJar
	gameVersions = ['1.21.1']
	loaders = ['fabric']
	changelog = rootProject.file('release-notes.md').exists()
		? rootProject.file('release-notes.md').text
		: 'No changelog provided.'
	dependencies {
		required.project 'fabric-api'
		optional.project 'modmenu'
		optional.project 'jei'
		optional.project 'emi'
	}
}
